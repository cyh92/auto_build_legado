name: 手动编译 OK-TV 签名版 APK (Gitee new-fm)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 直接用 git clone 拉取 Gitee 仓库（彻底修复来源问题）
      - name: 克隆 Gitee ok-tv 代码 (new-fm 分支)
        run: |
          git clone -b new-fm https://gitee.com/cyh92/ok-tv.git ok-tv

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

    # 👇 新增：安装 Python 3.10（修复 Chaquopy 报错）
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     # 3. 配置签名（写入 local.properties 文件）
      - name: 配置 APK 签名
        working-directory: ./ok-tv
        run: |
          cat >> local.properties << EOF
          storeFile=fm-tv.jks
          keyAlias=key0
          storePassword=123456
          keyPassword=123456
          EOF

      # 4. 编译
      - name: 构建 Release APK
        working-directory: ./ok-tv
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 🔥 修复：获取 完整正确路径的 APK（全部自动带 ok-tv/）
      - name: 获取所有 Release APK
        id: apk
        run: |
          APK_FILES=$(find $GITHUB_WORKSPACE/ok-tv/app/build/outputs/apk -name "*.apk" | grep -v debug | tr '\n' ' ')
          echo "files=$APK_FILES" >> $GITHUB_OUTPUT

      # 🔥 修复：时间生成
      - name: 获取当前时间
        id: time
        run: |
          echo "datetime=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "show=$(date +%Y-%m-%d %H:%M:%S)" >> $GITHUB_OUTPUT

      # 🔥 修复：发布（直接传完整路径，不需要加任何前缀）
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.time.outputs.datetime }}
          name: OK-TV 手动构建版 (Gitee new-fm) ${{ steps.time.outputs.show }}
          body: |
            ✅ 手动编译完成
            🔐 已使用 fm-tv.jks 签名
            🌿 分支：new-fm
          files: ${{ steps.apk.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
