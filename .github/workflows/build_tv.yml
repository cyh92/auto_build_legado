name: 手动编译 OK-TV 签名版 APK (Gitee new-fm)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 直接用 git clone 拉取 Gitee 仓库（彻底修复来源问题）
      - name: 克隆 Gitee ok-tv 代码 (new-fm 分支)
        run: |
          git clone -b new-fm https://gitee.com/cyh92/ok-tv.git ok-tv

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

    # 👇 新增：安装 Python 3.10（修复 Chaquopy 报错）
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     # 3. 配置签名（写入 local.properties 文件）
      - name: 配置 APK 签名
        working-directory: ./ok-tv
        run: |
          cat >> local.properties << EOF
          storeFile=fm-tv.jks
          keyAlias=key0
          storePassword=123456
          keyPassword=123456
          EOF

      # 4. 编译
      - name: 构建 Release APK
        working-directory: ./ok-tv
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 5. 获取 APK
      - name: 获取 APK 路径
        id: apk
        working-directory: ./ok-tv
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK_FILE" >> $GITHUB_OUTPUT

      # 6. 上传到 Releases
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OK-TV 手动构建版 (Gitee new-fm)
          body: |
            ✅ 手动编译完成
            🔐 已使用 fm-tv.jks 签名
            🌿 分支：new-fm
            📦 源码：https://gitee.com/cyh92/ok-tv.git
          files: ok-tv/${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
