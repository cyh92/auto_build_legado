name: 手动编译 OK-TV 签名版 APK (Gitee)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '请输入要编译的分支名'
        required: true
        default: 'fm-new'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取代码（使用手动输入的分支名）
      - name: 克隆 Gitee ok-tv 代码
        run: |
          git clone -b ${{ github.event.inputs.branch }} https://gitee.com/cyh92/ok-tv.git ok-tv

      # 2. 设置 JDK 17
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 设置 Python 3.10
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. 配置签名（无缩进、覆盖写入）
      - name: 配置 APK 签名
        working-directory: ./ok-tv
        run: |
          cat > local.properties << EOF
          storeFile=fm-tv.jks
          keyAlias=key0
          storePassword=123456
          keyPassword=123456
          EOF
          cat local.properties

      # 5. 构建
      - name: 构建 Release APK
        working-directory: ./ok-tv
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      # 6. 复制 APK 到 apks 文件夹
      - name: 创建 apks 文件夹
        run: mkdir -p apks

      - name: 复制所有 APK
        run: |
          find ok-tv/app/build/outputs/apk -name "*.apk" | grep -v debug | xargs -I {} cp {} apks/

      - name: 获取所有 APK
        id: apk
        run: echo "files=apks/*" >> $GITHUB_OUTPUT

      # 7. 生成时间
      - name: 获取当前时间
        id: time
        run: |
          echo "datetime=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "show=$(date +%Y-%m-%d %H:%M:%S)" >> $GITHUB_OUTPUT

      # 8. 发布
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.time.outputs.datetime }}
          name: OK-TV 手动构建版-${{ steps.time.outputs.datetime }}
          body: |
            ✅ 手动编译完成
            🔐 已使用 fm-tv.jks 签名
            🌿 分支：${{ github.event.inputs.branch }}
          files: ${{ steps.apk.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
