name: Build Media3 & Release AAR

# ======================= 【可修改变量】 =======================
env:
  REPO_URL: FongMi/media  # 仓库地址
  TARGET_BRANCH: release-1.10.0-fongmi                         # 要编译的分支
  AAR_PATH: media/build/outputs/aar/media-release.aar  # AAR 路径
# ==============================================================

on:
  workflow_dispatch:  # 手动触发
   inputs:
      copy_to_oktv:  # 复选框名称
        description: '是否更新源仓库'
        required: true
        default: false
        type: boolean  # 复选框

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew assembleRelease
        
      - name: Get current date
        id: date
        run: echo "datetime=$(date +%Y%m%d%H%M%S%3N)" >> $GITHUB_OUTPUT

      # ✅ 关键：只收集 move.txt 中列出的 AAR，不在列表里的不收集
      - name: Collect only AAR in move.txt
        run: |
          mkdir -p release_aars
          while IFS= read -r aar_name || [ -n "$aar_name" ]; do
            aar_name=$(echo "$aar_name" | xargs)
            if [ -z "$aar_name" ]; then continue; fi
            find ./libraries -name "$aar_name" -type f -exec cp {} release_aars/ \;
          done < move.txt

# ====================== 合并为一步 + 复选框控制 ======================
      - name: Clone & Copy AAR to ok-tv app/libs
        if: ${{ inputs.copy_to_oktv == true }}  # 勾选才执行
        run: |
          echo "🔹 开始克隆 ok-tv fm-new 分支..."
          cd ..
          git clone -b fm-new https://gitee.com/cyh92/ok-tv.git ok-tv-repo
          
          echo "🔹 复制 AAR 文件到 app/libs..."
          cp -f ${{ github.workspace }}/release_aars/*.aar ok-tv-repo/app/libs/
          
          echo "✅ 复制完成，文件列表："
          ls -la ok-tv-repo/app/libs/
      # ====================================================================
      # 2. 打包 ZIP
      - name: Zip all AARs
        run: |
          cd release_aars
          zip -q -r Media3-AARs.zip *.aar
          mv Media3-AARs.zip ../

      # 3. 同时上传：ZIP 压缩包 + 所有单独 AAR 文件
      - name: Create Release and Upload All
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-Media3-${{ steps.date.outputs.datetime }}
          name: Release AAR Media3-${{ steps.date.outputs.datetime }}
          files: |
            Media3-AARs.zip
            release_aars/*.aar
