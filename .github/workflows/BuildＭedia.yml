name: 编译 Media3

# ======================= 【可修改变量】 =======================
env:
  REPO_URL: FongMi/media  # 仓库地址
# ==============================================================

on:
  workflow_dispatch:  # 手动触发
    inputs:
      repo_source:
          description: 代码仓库来源
          type: choice
          options:
            - GitHub
            - Gitee
          required: true
          default: GitHub
      target_branch:
        description: '输入要编译的分支名'
        required: true
        default: 'release-1.11.0-fongmi'
        type: string
      update_branch:
        description: '输入源仓库分支'
        required: true
        default: 'fm-new'
        type: string
      copy_to_oktv:
        description: '是否更新源仓库'
        required: true
        default: false
        type: boolean
      custom:
        description: '添加自定义函数'
        required: true
        default: false
        type: boolean
      delrow:
        description: '删除示例和测试库'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: inputs.repo_source == 'GitHub'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          path: media
          
      - name: Clone Gitee 代码
        if: inputs.repo_source == 'Gitee'
        run: |
          # 清空当前目录，避免 git clone . 报错目录非空
          rm -rf ./*
          git clone -b ${{ inputs.target_branch }} --depth 1 https://cyh92:${{ secrets.MY_GITEE_TOKEN }}@gitee.com/cyh92/media.git media

      # ====================== 替换 Gradle 下载源为腾讯云 ======================
      - name: Replace Gradle Distribution URL with Tencent Mirror
        run: |
          GRADLE_PROPS="gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            sed -i 's|services.gradle.org/distributions|mirrors.cloud.tencent.com/gradle|g' "$GRADLE_PROPS"
            echo "✅ 已替换 Gradle 下载源为腾讯云镜像"
            cat "$GRADLE_PROPS"
          else
            echo "⚠️ 未找到 gradle-wrapper.properties 文件，跳过替换"
          fi
      # ====================================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: 修复缺失混淆文件和移除示例库
        if: inputs.delrow==true
        run: |
          # 修复缺失混淆文件
          # touch libraries/transformer/proguard-rules.txt
          # touch libraries/muxer/proguard-rules.txt
          # touch libraries/effect_lottie/proguard-rules.txt
          # touch libraries/effect/proguard-rules.txt
          # # 移除崩溃的预览Demo模块
          # sed -i '/demo/d' settings.gradle          
          # sed -i '/test-/d' build-logic-settings/src/main/kotlin/androidx/media3/buildlogic/Media3Modules.kt
          
          sed '211,244d' build-logic-settings/src/main/kotlin/androidx/media3/buildlogic/Media3Modules.kt
          rm -rf demos
          rm -rf libraries/test*
      - name: Inject stub classes for missing media3 customizations
        if: inputs.custom == true
        shell: bash
        run: |
          # FongMi/media public repo is missing custom classes that the app expects:
          #   MpvPlayer, MpvPlayerConfig, DiskPreloadManager, PlayerSeekView
          # Create minimal stubs so the AARs compile. isAvailable() returns false
          # so the MPV code path is never used at runtime.
          EXO=libraries/exoplayer/src/main/java
          UI=libraries/ui/src/main/java
          
          mkdir -p "$EXO/androidx/media3/mpvplayer"
          mkdir -p "$EXO/androidx/media3/exoplayer/source/preload"

          cat > "$EXO/androidx/media3/mpvplayer/MpvPlayer.java" << 'STUB'
          package androidx.media3.mpvplayer;

          import android.content.Context;
          import androidx.media3.common.ForwardingPlayer;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.SimpleExoPlayer;

          public class MpvPlayer extends ForwardingPlayer {

              public static boolean isAvailable() {
                  return false;
              }

              private MpvPlayer(SimpleExoPlayer player) {
                  super(player);
              }

              public void addSubtitle(MediaItem subtitle) {}

              public void setDecode(int decode) {}

              public void setSubtitleOptions(MpvPlayerConfig config) {}

              public static class Builder {
                  private final Context context;
                  private int decode;
                  private MpvPlayerConfig config;

                  public Builder(Context context) {
                      this.context = context;
                  }

                  public Builder setDecode(int decode) {
                      this.decode = decode;
                      return this;
                  }

                  public Builder setConfig(MpvPlayerConfig config) {
                      this.config = config;
                      return this;
                  }

                  public MpvPlayer build() {
                      return new MpvPlayer(new SimpleExoPlayer.Builder(context).build());
                  }
              }
          }
          STUB

          cat > "$EXO/androidx/media3/mpvplayer/MpvPlayerConfig.java" << 'STUB'
          package androidx.media3.mpvplayer;

          import android.content.Context;
          import java.io.File;

          public class MpvPlayerConfig {

              public static final String VIDEO_OUTPUT_GPU_NEXT = "gpu-next";

              private MpvPlayerConfig(Builder builder) {}

              public static class Builder {
                  public Builder() {}

                  public Builder setDefaultUserAgent(String userAgent) { return this; }

                  public Builder setHlsHttpPersistent(boolean enabled) { return this; }

                  public Builder addConfigDirectory(File dir) { return this; }

                  public Builder addAndroidFontConfig(File configDir, File cacheDir) { return this; }

                  public Builder addAndroidDefaults(String videoOutput, File cacheDir) { return this; }

                  public Builder addTlsCaFileFromAsset(Context context, String asset, String dest) { return this; }

                  public Builder addPostInitStringOption(String key, String value) { return this; }

                  public Builder addPreInitStringOption(String key, String value) { return this; }

                  public Builder addDiskCacheOptions(File cacheDir, int timeSeconds, int sizeMb) { return this; }

                  public Builder addAndroidSubtitleOptions(Context context, boolean caption, double position, double scale) { return this; }

                  public MpvPlayerConfig build() {
                      return new MpvPlayerConfig(this);
                  }
              }
          }
          STUB

          cat > "$EXO/androidx/media3/exoplayer/source/preload/DiskPreloadManager.java" << 'STUB'
          package androidx.media3.exoplayer.source.preload;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PriorityTaskManager;
          import androidx.media3.datasource.DataSource;
          import androidx.media3.datasource.cache.Cache;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.RenderersFactory;

          public class DiskPreloadManager {

              public DiskPreloadManager() {}

              public void start(ExoPlayer player, MediaItem mediaItem, Options options) {}

              public void release() {}

              public static class Builder {
                  public Builder(Cache cache, DataSource.Factory dataSourceFactory, RenderersFactory renderersFactory) {}

                  public Builder setPriorityTaskManager(PriorityTaskManager priorityTaskManager) {
                      return this;
                  }

                  public DiskPreloadManager build() {
                      return new DiskPreloadManager();
                  }
              }

              public static class Options {
                  public static Builder builder() {
                      return new Builder();
                  }

                  public static class Builder {
                      public Builder setDurationMs(long durationMs) { return this; }

                      public Builder setMaxThreads(int maxThreads) { return this; }

                      public Options build() {
                          return new Options();
                      }
                  }
              }
          }
          STUB

          cat > "$UI/androidx/media3/ui/PlayerSeekView.java" << 'STUB'
          package androidx.media3.ui;

          import android.content.Context;
          import android.util.AttributeSet;

          public class PlayerSeekView extends PlayerView {

              public PlayerSeekView(Context context) {
                  super(context);
              }

              public PlayerSeekView(Context context, AttributeSet attrs) {
                  super(context, attrs);
              }

              public PlayerSeekView(Context context, AttributeSet attrs, int defStyleAttr) {
                  super(context, attrs, defStyleAttr);
              }
          }
          STUB

          echo "Stub classes created:"
          find . -name "MpvPlayer.java" -o -name "MpvPlayerConfig.java" -o -name "DiskPreloadManager.java" -o -name "PlayerSeekView.java" | sort
               
      - name: 构建
        working-directory: ./media
        run: |
         chmod +x gradlew
         ./gradlew assembleRelease

      # - name: Build Release AAR
      #   run: ./gradlew assembleRelease
        
      - name: Get current date
        id: date
        run: echo "datetime=$(date +%Y%m%d%H%M%S%3N)" >> $GITHUB_OUTPUT

      # 只收集 move.txt 中列出的 AAR
      - name: 通过move.txt列表收集aar
        working-directory: ./media
        run: |
          mkdir -p release_aars
          if [ -f "move.txt" ]; then
           echo "✅ 检测到 move.txt，开始按列表收集"
            echo "=== move.txt 内容 ==="
            cat move.txt
            echo "======================"
      
            while IFS= read -r aar_name || [ -n "$aar_name" ]; do
              # 去除首尾空白、换行、\r 回车符（解决Windows换行）
              aar_name=$(echo "$aar_name" | tr -d '\r' | xargs)
              if [ -z "$aar_name" ]; then
                echo "⏭ 跳过空行"
                continue
              fi
              echo "🔍 正在查找文件：$aar_name"
              # 先打印找到的文件路径，确认是否匹配到
              find ./libraries -name "$aar_name" -type f
              # 复制文件
              find ./libraries -name "$aar_name" -type f -exec cp {} release_aars/ \;
            done < move.txt
          else
            echo "未找到 move.txt，递归复制 libraries 下所有AAR文件（不限层级）"
            find ./libraries -name "*.aar" -type f -exec cp {} release_aars/ \;
          fi
          # 收集完成后列出所有复制过来的aar文件
          echo "===== 已收集的AAR文件列表 ====="
          ls release_aars/

          # ========== 新增：复制 release_aars 到工作根目录 ${GITHUB_WORKSPACE} ==========
          echo "📤 将 release_aars 目录复制到 ${GITHUB_WORKSPACE}"
          cp -r release_aars "${GITHUB_WORKSPACE}/"
      - name: 提交release_aars变更到仓库
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
          git add release_aars/
          # 判断是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️ release_aars 无文件变更，跳过提交推送"
          else
            git commit -m "🤖 自动更新收集的AAR包 release_aars"
            git push
          fi

      # 复制 AAR 到 ok-tv 仓库
      - name: 复制并推送到远程仓库${{inputs.update_branch}}分支
        if: ${{ inputs.copy_to_oktv == true }}
        run: |
          cd ..
          git clone -b ${{inputs.update_branch}} https://cyh92:${{ secrets.MY_GITEE_TOKEN }}@gitee.com/cyh92/ok-tv.git ok-tv-repo
          cd ok-tv-repo
          
          # 复制AAR
          cp -f ${{ github.workspace }}/release_aars/*.aar app/libs/
          
          # 配置Git
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 提交变更
          git add -f app/libs/*.aar
          git commit -m "Auto update Media3 AARs (${{ steps.date.outputs.datetime }})"
          
          # 推送到远程${{inputs.update_branch}}分支
          git push origin ${{inputs.update_branch}}
          
          echo "✅ AAR复制 + 提交 + 推送全部完成！"

      # 打包 ZIP
      - name: Zip all AARs
        run: |
          cd release_aars
          zip -q -r Media3-AARs.zip *.aar
          mv Media3-AARs.zip ../

      # 创建 Release 并上传
      - name: Create Release and Upload All
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-Media3-${{ steps.date.outputs.datetime }}
          name: Release AAR Media3-${{ steps.date.outputs.datetime }}
          files: |
            Media3-AARs.zip
            release_aars/*.aar
