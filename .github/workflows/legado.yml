name: 构建筱筱书阁 APK

on:
  workflow_dispatch:  # 允许手动触发
    inputs: 
      defaultUrl:
        description: '使用仓库'
        required: true
        default: 'https://gitee.com/cyh92/legado.git'  
        type: choice
        options:
          - https://gitee.com/cyh92/legado.git
          - https://github.com/cyh92/legado.git
      defaultBranch:
        description: '使用分支'
        required: true
        default: 'new-leg'          
  push:
    paths:
      - '.last_upstream_commit'  # 当检测到上游更新时触发
    branches:
      - master  # 只在 master 分支上触发

jobs:
  build_readera:
    runs-on: ubuntu-latest
    if: github.repository_owner == github.actor

    steps:
      - name: 拉取构建脚本
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 设置构建参数
        shell: bash
        env:
          SECRETS_APP_NAME: "阅读x"
          SECRETS_GIT_URL: ${{ github.event.inputs.defaultUrl }}
          SECRETS_BRANCH: ${{ github.event.inputs.defaultBranch }}
          SECRETS_CHANNEL: "App"
          SECRETS_SUFFIX: "Pro"
          SECRETS_LAUNCH_NAME: "阅读.Pro"
          SECRETS_RENAME: "true"
          SECRETS_MINIFY: "false"
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_ACTOR: ${{ github.actor }}
        run: |
          source $GITHUB_WORKSPACE/action_setenv.sh

      - name: 克隆仓库
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_clone.sh

      #- name: 替换直链配置
      #  shell: bash
      #  run: |
      #    mkdir -p $APP_WORKSPACE/app/src/main/assets/defaultData
      #    cp $GITHUB_WORKSPACE/diy/directLinkUpload.json \
      #    $APP_WORKSPACE/app/src/main/assets/defaultData/directLinkUpload.json

      - name: 自定义应用（阅读.A, 共存包）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_app_custom.sh

      - name: （图标 / 默认配置 / JS 增强）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_legado_myself.sh

      - name: 编译 APK（Release 版本）
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_app_build.sh
          app_build
      - name: Get current date
        id: date
        run: echo "datetime=$(date +%Y%m%d%H%M%S%3N)" >> $GITHUB_OUTPUT

      - name: 自动发布 Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.APP_UPLOAD_NAME }}-${{ steps.date.outputs.datetime }}
          tag_name: release-${{ env.APP_UPLOAD_NAME }}-${{ steps.date.outputs.datetime }}
          files: ${{ env.APP_UPLOAD }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
