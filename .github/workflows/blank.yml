# This is a basic workflow to help you get started with Actions

name: 测试

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs: 
      defaultUrl:
        description: '使用仓库'
        required: true
        default: 'https://gitee.com/cyh92/legado.git'  
        type: choice
        options:
          - https://gitee.com/cyh92/legado.git
          - https://github.com/cyh92/legado.git
      defaultBranch:
        description: '使用分支'
        required: true
        default: 'new-dev'     
      publishGitee:
        description: '是否同步发布到 Gitee Release'
        required: false
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: 拉取构建脚本
        uses: actions/checkout@v4
      - name: 克隆 Gitee 代码
        run: |
          git clone -b ${{ github.event.inputs.defaultBranch }} ${{ github.event.inputs.defaultUrl }} legado

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: 复制签名文件
        run: |    
          cp -f sign/legado.jks legado/app/legado.jks    
          sed '$r '"$GITHUB_WORKSPACE/.github/legado/legado.sign"'' $GITHUB_WORKSPACE/legado/gradle.properties -i
          cd legado/app
          ls

      - name: 生成版本号
        id: date
        run: |
          # 拼接版本前缀+上海时区年月日时分：格式示例 3.26072515
          version="3.$(TZ=Asia/Shanghai date +%y%m%d%H)"
          # 标准写法输出变量到 GitHub Actions 上下文
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 打印当前生成的版本号
          echo "当前版本号: $version"
          sed -i "s/^def version = .*/def version = \"$version\"/" "$GITHUB_WORKSPACE/legado/app/build.gradle"
          cat $GITHUB_WORKSPACE/legado/app/build.gradle

      - name: 构建 Release APK
        working-directory: ./legado
        run: |
         chmod +x gradlew
         ./gradlew assembleApprelease -ParmOnly=true --build-cache --parallel --daemon --warning-mode all

        # 1. 创建 apks 文件夹
      - name: 创建 apks 文件夹
        run: mkdir -p apks

      # 2. 复制所有 release apk 到 apks 目录
      - name: 复制所有 APK 到 apks 目录
        run: |
          find legado/app/build/outputs/apk -name "*.apk" | grep -v debug | xargs -I {} cp {} apks/

      # 3. 读取 apks 目录下所有文件
      - name: 获取所有 APK
        id: apk
        run: echo "files=apks/*" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        run: |
          bash .github/legado/extract-latest-update.sh \
            $GITHUB_WORKSPACE/legado/app/src/main/assets/updateLog.md \
            > "$GITHUB_WORKSPACE/legado/release-notes.md"
            
      - name: 自动发布 Release
        if: success()
        uses:  softprops/action-gh-release@v1
        with:
          name: legado_app_${{ steps.date.outputs.version }}
          tag_name: ${{ steps.date.outputs.version }}
          body_path: $GITHUB_WORKSPACE/legado/release-notes.md
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
