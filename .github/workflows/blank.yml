# This is a basic workflow to help you get started with Actions

name: 测试

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs: 
      defaultUrl:
        description: '使用仓库'
        required: true
        default: 'https://gitee.com/cyh92/legado.git'  
        type: choice
        options:
          - https://gitee.com/cyh92/legado.git
          - https://github.com/cyh92/legado.git
      defaultBranch:
        description: '使用分支'
        required: true
        default: 'new-dev'     
      publishGitee:
        description: '是否同步发布到 Gitee Release'
        required: false
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: 拉取构建脚本
        uses: actions/checkout@v4
      - name: 克隆 Gitee 代码
        run: |
          git clone -b ${{ github.event.inputs.defaultBranch }} ${{ github.event.inputs.defaultUrl }} legado

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: 复制签名文件
        run: |    
          cp -f sign/legado.jks legado/app/legado.jks    
          sed '$r '"$GITHUB_WORKSPACE/.github/legado/legado.sign"'' $GITHUB_WORKSPACE/legado/gradle.properties -i
          cd legado/app
          ls

      - name: 构建 Release APK
        working-directory: ./legado
        run: |
         chmod +x gradlew
         ./gradlew assembleapprelease -ParmOnly=true --build-cache --parallel --daemon --warning-mode all
