# This is a basic workflow to help you get started with Actions

name: 测试

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs: 
      defaultUrl:
        description: '使用仓库'
        required: true
        default: 'https://gitee.com/cyh92/legado.git'  
        type: choice
        options:
          - https://gitee.com/cyh92/legado.git
          - https://github.com/cyh92/legado.git
      defaultBranch:
        description: '使用分支'
        required: true
        default: 'new-dev'     
      publishGitee:
        description: '是否同步发布到 Gitee Release'
        required: false
        type: boolean
        default: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: 拉取构建脚本
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 设置构建参数
        shell: bash
        env:
          SECRETS_APP_NAME: "阅读x"
          SECRETS_GIT_URL: ${{ github.event.inputs.defaultUrl }}
          SECRETS_BRANCH: ${{ github.event.inputs.defaultBranch }}
          SECRETS_CHANNEL: "App"
          SECRETS_SUFFIX: "Pro"
          SECRETS_LAUNCH_NAME: "阅读.Pro"
          SECRETS_RENAME: "true"
          SECRETS_MINIFY: "false"
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_ACTOR: ${{ github.actor }}
        run: |
          source $GITHUB_WORKSPACE/action_setenv.sh

      - name: 克隆仓库
        shell: bash
        run: |
          source $GITHUB_WORKSPACE/action_clone.sh

      - name: Prepare Release Notes
        run: |
          bash .github/legado/extract-latest-update.sh \
            $APP_WORKSPACE/app/src/main/assets/updateLog.md \
            > "$APP_WORKSPACE/release-notes.md"
            echo $APP_WORKSPACE/release-notes.md
